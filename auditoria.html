<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría · S.C.M.P.</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/darkmode.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <div class="content fade-in">
        <h1 class="page-title">Auditoría</h1>
        <p class="page-sub">Registro completo de acciones del sistema: casos, usuarios y cambios de estado. Nada se elimina de aquí.</p>

        <div class="card card-pad" style="margin:18px 0;">
          <div class="filter-bar">
            <select id="f-tipo">
              <option value="">Todos los tipos</option>
              <option value="caso">Casos</option>
              <option value="usuario">Usuarios</option>
            </select>
            <input type="text" id="f-buscar" placeholder="Buscar por texto o usuario…" style="padding:8px 11px;border-radius:8px;border:1px solid var(--paper-border);font-size:12.5px;min-width:240px;">
          </div>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Fecha</th><th>Usuario</th><th>Tipo</th><th>Acción</th></tr></thead>
              <tbody id="auditoria-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auditoria.js"></script>
</body>
</html>
