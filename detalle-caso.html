<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de caso · S.C.M.P.</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/darkmode.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <div class="content fade-in" id="detail-root">
        <div id="detail-header" style="margin-bottom:20px;">
          <div class="skeleton" style="height:60px;border-radius:12px;"></div>
        </div>

        <div class="tabs">
          <div class="tab-btn active" data-tab="tab-comparativa">Comparativa de versiones</div>
          <div class="tab-btn" data-tab="tab-evidencias">Evidencias</div>
          <div class="tab-btn" data-tab="tab-notas">Notas internas</div>
          <div class="tab-btn" data-tab="tab-timeline">Línea de tiempo</div>
          <div class="tab-btn" data-tab="tab-general">Información</div>
          <div class="tab-btn" data-tab="tab-analisis">Análisis y Resolución</div>
        </div>

        <div class="tab-panel active" id="tab-comparativa"></div>
        <div class="tab-panel" id="tab-evidencias"></div>
        <div class="tab-panel" id="tab-notas"></div>
        <div class="tab-panel" id="tab-timeline"></div>
        <div class="tab-panel" id="tab-general"></div>
        <div class="tab-panel" id="tab-analisis"></div>
      </div>
    </div>
  </div>

  <!-- Modal: cerrar caso con motivo -->
  <div class="modal-backdrop" id="modal-close-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h3>Cerrar caso</h3>
        <div class="modal-close" onclick="Utils.closeModal('modal-close-backdrop')">✕</div>
      </div>
      <form id="close-case-form">
        <div class="modal-body">
          <p class="text-sm text-muted" style="margin-top:0;">El caso pasará al estado <b style="color:var(--text-900);">Cerrado</b> y se registrará la fecha de cierre. Esta acción queda en la línea de tiempo.</p>
          <div class="field">
            <label>Motivo de cierre (opcional)</label>
            <textarea name="motivoCierre" style="min-height:90px;" placeholder="Ej. Se verificó la versión de la EBA con grabación de llamada; no se encontró mala práctica."></textarea>
            <div class="hint">Se añadirá también a "Acción tomada" en la comparativa de versiones.</div>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" onclick="Utils.closeModal('modal-close-backdrop')">Cancelar</button>
          <button type="submit" class="btn btn-accent">Cerrar caso</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/casos.js"></script>
</body>
</html>
