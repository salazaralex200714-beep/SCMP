<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios · S.C.M.P.</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/darkmode.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <div class="content fade-in">
        <div class="flex-between" style="margin-bottom:18px;flex-wrap:wrap;gap:12px;">
          <div>
            <h1 class="page-title">Usuarios</h1>
            <p class="page-sub">Administra los accesos de Supervisores y Agentes.</p>
          </div>
          <button class="btn btn-accent" id="btn-new-user">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Nuevo usuario
          </button>
        </div>

        <div class="card card-pad" style="margin-bottom:16px;">
          <div class="topbar-search" style="width:100%;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="search-usuarios" type="text" placeholder="Buscar por nombre, usuario o correo…">
          </div>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Usuario</th><th>País</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
              <tbody id="usuarios-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: alta/edición de usuario -->
  <div class="modal-backdrop" id="modal-user-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modal-user-title">Nuevo usuario</h3>
        <div class="modal-close" onclick="Utils.closeModal('modal-user-backdrop')">✕</div>
      </div>
      <form id="user-form">
        <div class="modal-body">
          <div class="field field-required"><label>Nombre completo</label><input type="text" name="nombre"></div>
          <div class="field field-required"><label>Usuario</label><input type="text" name="usuario" autocomplete="off"></div>
          <div class="field"><label>Correo</label><input type="text" name="email"></div>
          <div class="field">
            <label>País</label>
            <input type="text" name="pais" list="lista-paises" placeholder="Ej. Guatemala">
            <datalist id="lista-paises">
              <option value="Guatemala"><option value="Nicaragua"><option value="Honduras">
              <option value="El Salvador"><option value="República Dominicana"><option value="Panamá">
            </datalist>
            <div class="hint">Define en qué moneda se registrará el saldo pendiente de sus casos.</div>
          </div>
          <div class="field">
            <label>Rol</label>
            <select name="rol"><option value="Agente">Agente</option><option value="Supervisor">Supervisor</option></select>
          </div>
          <div class="field field-required">
            <label>Contraseña</label>
            <input type="password" id="f-password" name="password" autocomplete="new-password">
            <div class="hint" id="f-password-hint" style="display:none;">Por seguridad, cada persona solo puede cambiar su propia contraseña desde "Mi cuenta".</div>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" onclick="Utils.closeModal('modal-user-backdrop')">Cancelar</button>
          <button type="submit" class="btn btn-accent">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
